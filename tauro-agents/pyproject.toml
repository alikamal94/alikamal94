[project]
name = "tauro-agents"
version = "0.1.0"
description = "Tauro Markets marketing AI agent team"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.11",
  "pydantic>=2.7",
  "jinja2>=3.1",
  "playwright>=1.45",
  "pillow>=10",
  "apscheduler>=3.10,<4",
  "python-telegram-bot>=21",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
tradingview = ["mcp>=1.20"]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders real PNGs with headless Chromium"]
