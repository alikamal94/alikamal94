<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ali HQ — فريج علي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --s: 2; --ink: #1b1410; --cream: #f6ecd2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14101c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; }
  #stage { position: relative; line-height: 0; box-shadow: 0 0 0 4px var(--ink), 8px 8px 0 4px rgba(0,0,0,.5); }
  #view { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
  #labels { position: absolute; inset: 0; pointer-events: none; line-height: 1.15; }
  .plate {
    position: absolute; transform: translateX(-50%); pointer-events: auto; cursor: pointer;
    background: var(--cream); color: var(--ink); border: 2px solid var(--ink);
    box-shadow: 2px 2px 0 rgba(0,0,0,.55); padding: 1px 6px 2px; text-align: center; white-space: nowrap;
    border-top: calc(var(--s) * 1.5px + 1px) solid var(--c, #888); outline: 2px solid var(--ink); outline-offset: -1px;
    transition: transform .08s;
  }
  .plate b { display: block; font-weight: 700; font-size: calc(var(--s) * 3.4px + 3px); letter-spacing: .1px; }
  .plate span { display: block; direction: rtl; font-weight: 600; font-size: calc(var(--s) * 3.2px + 3px); opacity: .85; }
  .plate.hot { background: #fff8c9; transform: translateX(-50%) translateY(-2px) scale(1.06); box-shadow: 4px 4px 0 rgba(0,0,0,.6); z-index: 5; }
  #tags { position: absolute; inset: 0; pointer-events: none; line-height: 1; overflow: hidden; }
  .tag { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; will-change: transform; }
  .tag .nm {
    background: rgba(24,18,30,.88); color: #fff; border: 1px solid #000; border-radius: 2px; white-space: nowrap;
    font: 600 calc(var(--s) * 2.3px + 4.5px)/1.25 "IBM Plex Sans Arabic", system-ui, sans-serif; padding: 0 3px; pointer-events: auto; cursor: pointer;
  }
  .tag.ali .nm { background: #e9b82c; color: #1b1410; border-color: #1b1410; font-weight: 700; box-shadow: 1px 1px 0 #1b1410; }
  .tag.chief .nm { background: #5a3a1e; color: #ffe9b0; }
  .tag .st { height: calc(var(--s) * 5px + 4px); margin-bottom: 1px; display: flex; align-items: flex-end; justify-content: center; font: 700 calc(var(--s) * 3px + 5px)/1 system-ui, sans-serif; }
  .tag .st i { display: none; font-style: normal; }
  .tag[data-st="working"] .st .w { display: flex; gap: 1.5px; background: #fff; border: 1px solid #1b1410; border-radius: 6px; padding: 2px 3px; box-shadow: 1px 1px 0 rgba(0,0,0,.5); }
  .tag .st .w em { width: calc(var(--s) * 1px + 1px); height: calc(var(--s) * 1px + 1px); background: #1b1410; border-radius: 50%; animation: dot 1s infinite; }
  .tag .st .w em:nth-child(2) { animation-delay: .18s; } .tag .st .w em:nth-child(3) { animation-delay: .36s; }
  .tag[data-st="approval"] .st .a { display: block; background: #e0342b; color: #fff; border: 1px solid #1b1410; border-radius: 3px; padding: 1px 4px; box-shadow: 1px 1px 0 rgba(0,0,0,.5); animation: bounce .55s infinite alternate ease-in; }
  .tag[data-st="done"] .st .d { display: block; background: #2f9e44; color: #fff; border: 1px solid #1b1410; border-radius: 50%; padding: 1px 3px; box-shadow: 1px 1px 0 rgba(0,0,0,.5); }
  @keyframes dot { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-2px); } }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }
  #hint { position: fixed; right: 10px; bottom: 6px; z-index: 9; background: rgba(20,16,28,.8); padding: 2px 6px; color: #a99cc0; font: 11px/1.2 system-ui, sans-serif; opacity: .8; }
  #hint kbd { background: #2a2338; border: 1px solid #554a6b; border-radius: 3px; padding: 0 4px; color: #e8dcff; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view" width="640" height="384"></canvas>
  <div id="labels"></div>
  <div id="tags"></div>
</div>
<div id="hint">click the ground or use <kbd>←↑↓→</kbd> to walk · <kbd>N</kbd> toggle night</div>

<script>
"use strict";
/* =====================================================================
   ALI HQ — Phase 1: the world
   Internal resolution 640x384, integer fillRect pixels only.
   ===================================================================== */
const W = 640, H = 384;

/* ---------- data ---------- */
const PW = 122, PH = 72, TOP_Y = 16, BOT_Y = 276;
const HOUSES = [
  { id:'loud',   en:'Loud Production House', ar:'لاود برودكشن هاوس', color:'#c0392b', px:20,  py:TOP_Y },
  { id:'tauro',  en:'Tauro Markets',         ar:'تاورو ماركتس',      color:'#d4a020', px:161, py:TOP_Y },
  { id:'bo3li',  en:'bo3li.trading',         ar:'بوعلي تريدنق',      color:'#2f6f9f', px:298, py:TOP_Y },
  { id:'sage',   en:'Sage',                  ar:'سيج',               color:'#3f8a3e', px:441, py:TOP_Y },
  { id:'ali',    en:"Ali's House",           ar:'بيت علي',           color:'#d4a020', px:20,  py:BOT_Y },
  { id:'lamaat', en:"Lama'at Fakhri",        ar:'لمعة فخري',         color:'#c0567d', px:161, py:BOT_Y },
  { id:'mf',     en:'MF Trading',            ar:'إم إف تريدنق',      color:'#3b3240', px:298, py:BOT_Y },
  { id:'dorek',  en:'Dorek',                 ar:'دورك',              color:'#7b4fb0', px:441, py:BOT_Y },
];
const MAJLIS = { id:'majlis', en:'The Majlis', ar:'المجلس', color:'#2bb5a8', x:226, w:128, roofY:126, roofH:26, wallY:152, wallH:32 };
const PLAZA = { x:214, y:186, w:152, h:72 };
const FOUNTAIN = { x:290, y:222, r:13 };
const SEA_X = 588, BEACH_X = 572;

const SOLIDS = [];      // collision rects (used by Phase 2)
const WINDOWS = [];     // {x,y,w,h} panes that glow at night
const LANTERNS = [];    // {x,y} light sources
const HOTSPOTS = [];    // {id,x,y,w,h} hover / click areas

/* ---------- pixel helpers ---------- */
let g = null; // current drawing context
function R(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, h | 0); }
function P(x, y, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, 1, 1); }
function line(x0, y0, x1, y1, c) {
  x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  g.fillStyle = c;
  for (;;) {
    g.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
function spr(x, y, rows, pal, flip) {
  for (let j = 0; j < rows.length; j++) {
    const row = rows[j], n = row.length;
    for (let i = 0; i < n; i++) {
      const ch = row[flip ? n - 1 - i : i];
      if (ch !== '.' && pal[ch]) P(x + i, y + j, pal[ch]);
    }
  }
}
function shade(hex, f) { // f in -1..1 : darken / lighten
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, gg = (n >> 8) & 255, b = n & 255;
  const t = f < 0 ? 0 : 255, a = Math.abs(f);
  r = Math.round(r + (t - r) * a); gg = Math.round(gg + (t - gg) * a); b = Math.round(b + (t - b) * a);
  return '#' + ((1 << 24) | (r << 16) | (gg << 8) | b).toString(16).slice(1);
}
let seed = 20261120;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
function ri(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }
function noise(x, y, w, h, cols, density) {
  const n = Math.floor(w * h * density);
  for (let i = 0; i < n; i++) P(x + ri(0, w - 1), y + ri(0, h - 1), cols[ri(0, cols.length - 1)]);
}
function shadowRect(x, y, w, h, a) { R(x, y, w, h, `rgba(30,18,8,${a == null ? 0.28 : a})`); }
function solid(x, y, w, h) { SOLIDS.push({ x, y, w, h }); }

/* arch-topped rect */
function arch(x, y, w, h, c) {
  const r = Math.min(Math.floor(w / 2), 4);
  for (let i = 0; i < r; i++) {
    const inset = Math.round(r - Math.sqrt(r * r - (r - i - 0.5) * (r - i - 0.5)));
    R(x + inset, y + i, w - inset * 2, 1, c);
  }
  R(x, y + r, w, h - r, c);
}
/* half-dome seen from the front */
function dome(cx, baseY, rx, h, base, hi, sh) {
  for (let i = 0; i < h; i++) {
    const t = (h - i - 0.5) / h;
    const hw = Math.max(1, Math.round(rx * Math.sqrt(1 - t * t)));
    const y = baseY - h + i;
    R(cx - hw, y, hw * 2, 1, base);
    R(cx + Math.round(hw * 0.45), y, hw - Math.round(hw * 0.45), 1, sh);
    if (hw > 2) R(cx - Math.round(hw * 0.7), y, Math.max(1, Math.round(hw * 0.28)), 1, hi);
    P(cx - hw, y, sh); P(cx + hw - 1, y, shade(sh, -0.25));
  }
}
/* brick-textured wall */
function brick(x, y, w, h, base) {
  R(x, y, w, h, base);
  const d = shade(base, -0.1), l = shade(base, 0.12);
  for (let j = 3; j < h; j += 4) {
    R(x, y + j, w, 1, d);
    const off = ((j - 3) / 4) % 2 ? 0 : 4;
    for (let i = off + 2; i < w; i += 8) P(x + i, y + j - 2, d), P(x + i, y + j - 1, d);
  }
  noise(x, y, w, h, [l, d], 0.03);
}
/* paved street */
function paved(x, y, w, h) {
  R(x, y, w, h, '#d9d0bf');
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) {
    if (i % 6 === 0 || j % 6 === 0) P(i, j, '#c4b9a5');
    else if ((i % 6 === 1) && (j % 6 === 1)) P(i, j, '#e7dfd0');
  }
  noise(x, y, w, h, ['#cfc5b2', '#e2dacb'], 0.04);
}
function streetEdge(x, y, w, h) { // darker kerb around a street piece
  R(x, y - 1, w, 1, '#a8987c'); R(x, y + h, w, 1, '#b9a47e');
}

/* ---------- scenery pieces ---------- */
const PALMS = [];
function palm(x, y, hgt, replay) {
  hgt = hgt || 16;
  if (!replay) { R(x - 5, y, 12, 2, 'rgba(30,18,8,.22)'); R(x - 3, y + 2, 8, 1, 'rgba(30,18,8,.16)'); PALMS.push({ x, y, hgt }); solid(x - 1, y - 2, 4, 3); }
  let tx = x;
  for (let i = 0; i <= hgt; i++) {
    tx = x + Math.round(Math.sin(i / hgt * 1.4) * 3);
    R(tx, y - i, 2, 1, i % 3 === 0 ? '#5f3b1c' : '#8a5a2e');
    if (i % 3 === 1) P(tx, y - i, '#a8733d');
  }
  const cx = tx + 1, cy = y - hgt;
  const fr = [[-9, 4], [-9, -1], [-6, -5], [-2, -8], [3, -8], [7, -5], [9, -1], [9, 4], [-5, 6], [5, 6]];
  for (const [dx, dy] of fr) {
    const mx = cx + Math.round(dx * 0.55), my = cy + Math.round(dy * 0.55) - 2;
    line(cx, cy, mx, my, '#2c6a2a'); line(mx, my, cx + dx, cy + dy, '#2c6a2a');
    line(cx, cy - 1, mx, my - 1, '#55a33d');
    P(cx + dx, cy + dy, '#1f4f20');
    P(mx, my - 1, '#7cc552');
  }
  R(cx - 1, cy - 1, 3, 2, '#2c6a2a');
  P(cx - 2, cy + 1, '#e58a1f'); P(cx + 1, cy + 1, '#e58a1f'); P(cx - 1, cy + 2, '#f2a53a'); P(cx, cy + 2, '#c96d12'); P(cx + 2, cy + 2, '#f2a53a');
}
function bush(x, y, flower) {
  R(x, y + 3, 7, 1, 'rgba(30,18,8,.2)');
  R(x + 1, y, 5, 4, '#3d8a35'); R(x, y + 1, 7, 2, '#3d8a35');
  P(x + 2, y, '#63b54a'); P(x + 1, y + 1, '#63b54a'); P(x + 4, y + 1, '#2c6a2a'); P(x + 5, y + 2, '#2c6a2a');
  if (flower) { P(x + 3, y + 1, flower); P(x + 1, y + 2, flower); P(x + 5, y + 1, flower); }
}
function jar(x, y, big) {
  const pal = { a: '#b5653a', b: '#d58b55', c: '#8a4526', d: '#5c2c16', s: 'rgba(30,18,8,.25)' };
  if (big) spr(x, y, ['.dcd.', '.aba.', 'abbac', 'abaac', 'abaac', '.aac.', 'sssss'], pal);
  else spr(x, y, ['.dd.', 'abac', 'abac', '.ac.', 'ssss'], pal);
}
function jars(x, y) { jar(x, y, true); jar(x + 6, y + 2, false); jar(x - 4, y + 2, false); solid(x - 4, y + 3, 14, 4); }
function carpet(x, y, w, h, c1, c2) {
  R(x, y, w, h, c1);
  R(x + 1, y + 1, w - 2, h - 2, c2); R(x + 2, y + 2, w - 4, h - 4, c1);
  for (let i = 4; i < w - 4; i += 4) {
    const my = y + (h >> 1);
    P(x + i, my - 1, '#f1dca0'); P(x + i - 1, my, '#f1dca0'); P(x + i + 1, my, '#f1dca0'); P(x + i, my + 1, '#f1dca0'); P(x + i, my, c2);
  }
  for (let i = 3; i < w - 2; i += 3) { P(x + i, y + 2, '#1b1410'); P(x + i, y + h - 3, '#1b1410'); }
  for (let j = 0; j < h; j += 2) { P(x - 1, y + j, '#f1e6c8'); P(x + w, y + j, '#f1e6c8'); }
}
function tent(x, y, w) { // black Bedouin tent (bait al-sha'ar)
  w = w || 38;
  shadowRect(x + 2, y + 17, w, 3, 0.25);
  // ropes
  line(x - 4, y + 16, x + 2, y + 5, '#c8b48a'); line(x + w + 3, y + 16, x + w - 3, y + 5, '#c8b48a');
  P(x - 4, y + 17, '#5f3b1c'); P(x + w + 3, y + 17, '#5f3b1c');
  // roof with peaks
  for (let i = 0; i < w; i++) {
    const ph = Math.round(2 * Math.abs(Math.sin(i / w * Math.PI * 3)));
    R(x + i, y + 3 - ph, 1, 6 + ph, '#231d1b');
    P(x + i, y + 3 - ph, '#4a403b');
  }
  // sadu stripes on roof
  for (let i = 0; i < w; i++) {
    P(x + i, y + 5, i % 4 < 2 ? '#e9e2d0' : '#b3261e');
    P(x + i, y + 7, i % 2 ? '#e9e2d0' : '#231d1b');
    P(x + i, y + 8, '#b3261e');
  }
  // open front
  R(x + 1, y + 9, w - 2, 8, '#120d0b');
  // patterned divider (qata)
  const dx = x + Math.floor(w * 0.55);
  for (let j = 0; j < 8; j++) for (let i = 0; i < Math.floor(w * 0.4); i++) {
    const k = (i + j) % 6;
    P(dx + i, y + 9 + j, j === 0 || j === 7 ? '#e9e2d0' : k < 2 ? '#b3261e' : k < 3 ? '#e9e2d0' : k < 5 ? '#231d1b' : '#d48a1a');
  }
  // interior carpet + cushions
  R(x + 3, y + 14, Math.floor(w * 0.45), 3, '#8f2a22'); R(x + 4, y + 15, Math.floor(w * 0.45) - 2, 1, '#d9a441');
  R(x + 4, y + 12, 4, 2, '#d9c7a0'); R(x + 10, y + 12, 4, 2, '#2f6f9f');
  // poles
  for (const px of [x, x + (w >> 1), x + w - 1]) { R(px, y + 4, 1, 14, '#8a6a3a'); }
  solid(x, y + 4, w, 12);
}
const CAMEL = [
  '...............hh...',
  '..............hheh..',
  '..............hhhhh.',
  '......ss......hh....',
  '.....ssss.....hh....',
  '...bbrrrrbb..bhh....',
  '..bbbryyrbbbbbh.....',
  '.tbbbrrrrbbbbbb.....',
  '.tbbbbrrbbbbbb......',
  '..bbbbbbbbbbbb......',
  '...bb.dd..dd.bb.....',
  '...b...d..d...b.....',
  '...b...d..d...b.....',
  '...b...d..d...b.....',
  '...k...k..k...k.....',
];
function camel(x, y, flip) {
  R(x + 1, y + 14, 15, 2, 'rgba(30,18,8,.25)');
  spr(x, y, CAMEL, { b: '#c99b5a', h: '#d4aa6a', s: '#b98848', d: '#a57a42', t: '#a57a42', k: '#5f431f', r: '#b3261e', y: '#e8b93a', e: '#1b1410' }, flip);
  solid(x + 2, y + 9, 13, 5);
}
function well(x, y) {
  R(x, y + 10, 13, 2, 'rgba(30,18,8,.25)');
  // stone ring
  R(x + 2, y + 4, 9, 7, '#a59a88'); R(x + 1, y + 5, 11, 5, '#a59a88');
  R(x + 2, y + 4, 9, 1, '#cfc6b5'); R(x + 3, y + 5, 7, 3, '#12303f'); P(x + 4, y + 6, '#3f8fb0'); P(x + 7, y + 6, '#3f8fb0');
  for (let i = 1; i < 12; i += 3) P(x + i, y + 9, '#7d7363');
  // frame + little roof + bucket
  R(x + 1, y - 4, 1, 9, '#6b4320'); R(x + 11, y - 4, 1, 9, '#6b4320');
  R(x, y - 6, 13, 2, '#8a5a2e'); R(x + 1, y - 7, 11, 1, '#a8733d'); R(x, y - 4, 13, 1, '#5f3b1c');
  R(x + 6, y - 3, 1, 4, '#c8b48a'); R(x + 5, y + 1, 3, 2, '#7a4a22'); P(x + 6, y + 1, '#a8733d');
  solid(x + 1, y + 4, 11, 7);
}
function stall(x, y, c, goods) { // souk stall with striped canopy
  shadowRect(x + 1, y + 15, 19, 2, 0.25);
  R(x + 1, y + 6, 1, 9, '#6b4320'); R(x + 18, y + 6, 1, 9, '#6b4320');
  // counter
  R(x + 1, y + 9, 18, 6, '#8a5a2e'); R(x + 1, y + 9, 18, 1, '#b98045'); R(x + 1, y + 14, 18, 1, '#5f3b1c');
  for (let i = 4; i < 18; i += 5) R(x + i, y + 10, 1, 4, '#734a23');
  // goods
  const gs = goods || ['#e58a1f', '#b3261e', '#3f8a3e', '#e8d33a'];
  for (let i = 0; i < 5; i++) { R(x + 2 + i * 3 + (i > 2 ? 1 : 0), y + 7, 2, 2, gs[i % gs.length]); P(x + 2 + i * 3 + (i > 2 ? 1 : 0), y + 7, shade(gs[i % gs.length], 0.35)); }
  // canopy
  for (let i = 0; i < 20; i++) {
    const col = (i >> 1) % 2 ? '#f4ead2' : c;
    R(x + i, y, 1, 5, col); P(x + i, y, shade(col, 0.2)); P(x + i, y + 4, shade(col, -0.2));
    if ((i >> 1) % 2 === 0) P(x + i, y + 5, shade(c, -0.2));
  }
  R(x, y - 1, 20, 1, shade(c, -0.35));
  solid(x, y + 6, 20, 9);
}
function bench(x, y) {
  R(x, y + 5, 13, 1, 'rgba(30,18,8,.25)');
  R(x, y, 13, 2, '#a8733d'); R(x, y, 13, 1, '#c98f52'); R(x, y + 2, 13, 2, '#8a5a2e'); R(x, y + 3, 13, 1, '#6b4320');
  R(x + 1, y + 4, 1, 2, '#4a2e14'); R(x + 11, y + 4, 1, 2, '#4a2e14');
  solid(x, y + 1, 13, 4);
}
function lantern(x, y) { // post lantern; x,y = base
  R(x - 1, y, 3, 1, 'rgba(30,18,8,.3)');
  R(x, y - 9, 1, 9, '#3a2c1c'); P(x - 1, y - 1, '#3a2c1c'); P(x + 1, y - 1, '#3a2c1c');
  R(x - 1, y - 13, 3, 4, '#d4a020'); R(x, y - 12, 1, 2, '#fff2a8'); P(x, y - 14, '#8a6a1a'); R(x - 1, y - 9, 3, 1, '#8a6a1a');
  LANTERNS.push({ x, y: y - 11 });
  solid(x - 1, y - 2, 3, 2);
}
function barjeel(x, y, w, h, col) { // wind tower
  shadowRect(x + w, y + 4, 2, h - 3, 0.22);
  R(x, y, w, h, col); R(x + w - 2, y, 2, h, shade(col, -0.14)); R(x, y, 1, h, shade(col, 0.15));
  R(x - 1, y, w + 2, 2, shade(col, 0.18)); R(x - 1, y + 2, w + 2, 1, shade(col, -0.25));
  const sh = Math.max(5, Math.floor(h * 0.5));
  for (let i = 2; i < w - 2; i += 3) { R(x + i, y + 4, 2, sh, '#3a2a1c'); P(x + i, y + 4, '#1b1410'); }

/* ---------- day / night (Kuwait time) ---------- */
let nightOverride = null;
function kuwaitHour() {
  const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kuwait', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date());
  const h = +parts.find(p => p.type === 'hour').value % 24, m = +parts.find(p => p.type === 'minute').value;
  return h + m / 60;
}
function autoNight() {
  const h = kuwaitHour();
  if (h < 5 || h >= 18.5) return 1;
  if (h < 6.5) return 1 - (h - 5) / 1.5;
  if (h >= 17) return (h - 17) / 1.5;
  return 0;
}
let nightShown = null;
function nightTarget() { return nightOverride == null ? autoNight() : nightOverride ? 1 : 0; }

  const row = (j, a, b, col) => { for (let i = a; i <= b; i++) set(i, j, col); };
  const cloth = (i, j) => {
    if (sp.f) return (i === 1 || i === 8) ? shade(sp.shayla, -0.22) : (j === 1 ? shade(sp.shayla, 0.2) : sp.shayla);
    if (sp.ghutra === 'red') return ((i + j) % 2 === 0) ? '#c8372d' : '#f8f5ee';
    return (i === 1 || i === 8) ? '#d8d3c6' : '#f8f5ee';
  };
  const crow = (j, a, b) => { for (let i = a; i <= b; i++) set(i, j, cloth(i, j)); };
  const body = sp.f ? '#211d27' : '#f6f4ee', bodySh = sp.f ? '#15121a' : '#d6d1c4', bodyHi = sp.f ? '#3a3444' : '#ffffff';
  const gold = '#e9bd3a', skin = sp.skin, eye = '#1b1410', agal = '#17130f', shoe = sp.f ? '#5a5068' : '#6b4320', hair = '#3a2a1c';
  const bisht = sp.bisht, bishtSh = bisht ? shade(bisht, -0.25) : null;

  if (!side) {
    for (let j = 7; j <= 14; j++) { row(j, 2, 7, body); set(7, j, bodySh); set(3, j, bodyHi); }
    for (let j = 7; j <= 10; j++) { set(1, j, body); set(8, j, bodySh); }
    set(1, 11, skin); set(8, 11, skin);
    if (bisht) {
      if (dir === 'down') {
        for (let j = 7; j <= 14; j++) { set(2, j, bisht); set(7, j, bishtSh); set(3, j, gold); set(6, j, gold); set(4, j, '#f6f4ee'); set(5, j, '#e4dfd2'); }
        for (let j = 7; j <= 10; j++) { set(1, j, bisht); set(8, j, bishtSh); }
      } else {
        for (let j = 7; j <= 14; j++) { row(j, 2, 7, bisht); set(7, j, bishtSh); }
        for (let j = 7; j <= 10; j++) { set(1, j, bisht); set(8, j, bishtSh); }
        row(14, 2, 7, gold); set(1, 10, gold); set(8, 10, gold);
      }
    }
    if (sp.f && sp.dir) { row(14, 2, 7, gold); set(1, 10, gold); set(8, 10, gold); if (dir === 'down') { set(4, 8, gold); set(5, 8, gold); } }
    // feet (2-frame walk)
    if (step !== 2) set(3, 15, shoe); if (step !== 1) set(6, 15, shoe);
    if (step === 1) row(14, 5, 7, sp.f || (bisht && dir === 'up') ? G[13][6] : G[13][6]);

    crow(1, 2, 7);
    if (dir === 'down') {
      crow(2, 1, 8);
      for (let j = 3; j <= 5; j++) { set(1, j, cloth(1, j)); set(8, j, cloth(8, j)); row(j, 2, 7, skin); }
      if (sp.f) { crow(3, 1, 8); crow(6, 1, 8); set(2, 4, cloth(2, 4)); set(7, 4, cloth(7, 4)); set(2, 5, cloth(2, 5)); set(7, 5, cloth(7, 5)); crow(7, 3, 6); }
      else { row(2, 1, 8, agal); crow(6, 1, 2); crow(6, 7, 8); row(6, 3, 6, skin); set(1, 7, cloth(1, 7)); set(8, 7, cloth(8, 7)); if (sp.beard) { row(5, 3, 6, hair); set(2, 5, hair); set(7, 5, hair); row(6, 3, 6, hair); set(4, 5, skin); set(5, 5, skin); } }
      set(3, 4, eye); set(6, 4, eye);
    } else {
      for (let j = 2; j <= 6; j++) crow(j, 1, 8);
      crow(7, 2, 7); crow(8, 3, 6);

    }
  } else {

    for (let j = 7; j <= 14; j++) { row(j, 3, 7, body); set(3, j, bodySh); set(7, j, bodyHi); }

    set(5, 11, skin);
    if (step === 0) { set(4, 15, shoe); set(6, 15, shoe); }
    else if (step === 1) { set(3, 15, shoe); set(7, 15, shoe); }
    else { set(5, 15, shoe); set(4, 15, shoe); }
    crow(1, 2, 7); crow(2, 1, 8);
    for (let j = 3; j <= 5; j++) { crow(j, 1, 4); row(j, 5, 8, skin); }
    if (sp.f) { crow(3, 1, 8); set(5, 4, cloth(5, 4)); set(5, 5, cloth(5, 5)); crow(6, 1, 8); crow(7, 2, 4); crow(8, 2, 3); }
    else { row(2, 1, 8, agal); crow(6, 1, 5); row(6, 6, 7, skin); crow(7, 2, 3); set(2, 8, cloth(2, 8)); if (sp.beard) { row(5, 6, 8, hair); set(6, 6, hair); set(7, 6, hair); set(5, 5, hair); } }

  const O = '#1b1410', out = G.map(r => r.slice());
  for (let j = 0; j < 17; j++) for (let i = 0; i < 10; i++) {
    if (G[j][i]) continue;
    if ((j > 0 && G[j - 1][i]) || (j < 16 && G[j + 1][i]) || (i > 0 && G[j][i - 1]) || (i < 9 && G[j][i + 1])) out[j][i] = O;
  }

  const x = c.getContext('2d');

}

/* ---- collision bitmap + A* grid ---- */
const blocked = new Uint8Array(W * H);

  mark(SEA_X - 3, 0, W, 217); mark(SEA_X - 3, 227, W, H); mark(625, 0, W, H);   // sea, except the pier

/* ---- characters ---- */
const chars = [], byId = {};
let ALI = null, RASHED = null;
const trail = [];
let marker = null;
const keys = {};
const tagsEl = document.getElementById('tags');

function houseOf(id) { return HOUSES.find(h => h.id === id); }
function makeLook(a, i) {
  const h = houseOf(a.house);
  const look = { f: !!a.f, dir: !!a.dir, ghutra: a.ghutra || 'white', beard: !!a.beard, skin: SKINS[i % SKINS.length] };
  if (a.f) look.shayla = h.id === 'mf' ? '#6a5a78' : h.color;
  if (a.bisht) look.bisht = a.bisht;
  else if (a.dir && !a.f) look.bisht = h.id === 'mf' ? '#2a2230' : shade(h.color, -0.45);
  look.key = a.id;
  return look;
}
function spawn(a, x, y, i) {
  const c = { a, id: a.id, x, y, dir: 'down', walk: 0, moving: false, path: null, speed: 20, look: makeLook(a, i), wait: 1 + rnd() * 4, status: a.status || 'idle', mode: 'home' };
  chars.push(c); byId[a.id] = c;
  if (a.name) {
    const el = document.createElement('div');
    el.className = 'tag' + (a.kind ? ' ' + a.kind : ''); el.dataset.id = a.id;
    el.innerHTML = '<div class="st"><i class="w"><em></em><em></em><em></em></i><i class="a">!</i><i class="d">✓</i></div><div class="nm"></div>';
    el.querySelector('.nm').textContent = (a.kind === 'ali' ? '★ ' : '') + a.name;
    tagsEl.append(el); c.tag = el; setStatus(c, c.status);
  }
  return c;
}
function setStatus(c, st) { c.status = st; if (c.tag) c.tag.dataset.st = st; }

function buildPeople() {
  buildCollision();
  AGENTS.forEach((a, i) => {
    const h = houseOf(a.house), cx = h.px + (PW >> 1);
    if (a.kind === 'ali') { ALI = spawn(a, 284, 200, i); ALI.speed = 58; return; }
    if (a.kind === 'chief') { RASHED = spawn(a, 304, 198, i); RASHED.speed = 58; return; }
    const c = spawn(a, cx + (a.dir ? -16 : 16), h.py + 60, i);
    // director keeps to the left of the door, worker to the right, so their tags don't stack
    let x0 = a.dir ? cx - 40 : cx + 8, x1 = a.dir ? cx - 8 : cx + 40;
    if (h.id === 'dorek') { x0 = a.dir ? cx - 40 : cx - 14; x1 = a.dir ? cx - 20 : cx + 6; c.x = a.dir ? cx - 28 : cx - 4; }
    c.home = { x0, x1, y0: h.py + 56, y1: h.py + 66, hx: c.x, hy: c.y };
  });
  // Dorek's queue of customers (no name tags)
  const dq = houseOf('dorek').queue || [];
  const looks = [{ ghutra: 'white' }, { f: 1 }, { ghutra: 'red', beard: 1 }];
  dq.forEach(([x, y], i) => {
    const c = spawn({ id: 'customer-' + i, house: 'dorek', f: looks[i].f, ghutra: looks[i].ghutra, beard: looks[i].beard }, x, y, i + 1);
    if (looks[i].f) c.look.shayla = ['#c0567d', '#2bb5a8'][i % 2];
    c.dir = 'left'; c.mode = 'static';
  });
}
function goTo(c, x, y) { const p = findPath(c.x, c.y, x, y); c.path = p && p.length ? p : null; return !!c.path; }
function faceBy(c, dx, dy) { if (Math.abs(dx) > Math.abs(dy)) c.dir = dx < 0 ? 'left' : 'right'; else if (dy) c.dir = dy < 0 ? 'up' : 'down'; }
function followPath(c, dt) {
  if (!c.path || !c.path.length) { c.path = null; return false; }
  let left = c.speed * dt;
  while (left > 0 && c.path.length) {
    const [tx, ty] = c.path[0], dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy);
    if (d <= left) { c.x = tx; c.y = ty; c.path.shift(); left -= d; if (d > 0.01) faceBy(c, dx, dy); }
    else { c.x += dx / d * left; c.y += dy / d * left; faceBy(c, dx, dy); left = 0; }

}
function updatePeople(dt) {
  // --- Ali: arrow keys or click-to-walk
  let kx = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0), ky = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0);
  if (kx || ky) {
    ALI.path = null; marker = null;
    const n = Math.hypot(kx, ky), sx = kx / n * ALI.speed * dt, sy = ky / n * ALI.speed * dt;
    let moved = false;
    if (sx && !isBlocked(ALI.x + sx, ALI.y)) { ALI.x += sx; moved = true; }
    if (sy && !isBlocked(ALI.x, ALI.y + sy)) { ALI.y += sy; moved = true; }
    faceBy(ALI, kx, ky * 0.99);
    ALI.moving = moved;
  } else {
    ALI.moving = followPath(ALI, dt);
    if (!ALI.moving) marker = null;
  }
  // breadcrumb trail for Rashed
  const last = trail[trail.length - 1];
  if (!last || Math.hypot(ALI.x - last[0], ALI.y - last[1]) >= 2) trail.push([ALI.x, ALI.y]);

  if (RASHED.mode === 'home') {
    RASHED.moving = false;
    let left = RASHED.speed * 1.05 * dt;
    while (trail.length > 9 && left > 0) {
      const [tx, ty] = trail[0], dx = tx - RASHED.x, dy = ty - RASHED.y, d = Math.hypot(dx, dy);
      if (d <= left) { RASHED.x = tx; RASHED.y = ty; trail.shift(); left -= d; }

      if (d > 0.01) faceBy(RASHED, dx, dy);

    }

      if (!c.moving) {

            const x = c.home.x0 + rnd() * (c.home.x1 - c.home.x0), y = c.home.y0 + rnd() * (c.home.y1 - c.home.y0);

function drawPeople(t) {
  g = fx;
  const items = chars.map(c => ({ y: c.y, c }));
  for (const p of PALMS) {
    for (const c of chars) if (c.y < p.y - 1 && c.y > p.y - p.hgt - 8 && Math.abs(c.x - p.x - 2) < 15) { items.push({ y: p.y, p }); break; }
  }
  items.sort((a, b) => a.y - b.y);

    const k = ((t * 6) | 0) % 2, mx = marker[0] | 0, my = marker[1] | 0;
    R(mx - 3 - k, my, 2, 1, '#fff8c9'); R(mx + 2 + k, my, 2, 1, '#fff8c9'); R(mx, my - 2 - k, 1, 1, '#fff8c9'); R(mx, my + 2 + k, 1, 1, '#fff8c9'); P(mx, my, '#e2b93a');
  }
  for (const it of items) {
    if (it.p) { g = fx; palm(it.p.x, it.p.y, it.p.hgt, true); continue; }
    const c = it.c, x = Math.round(c.x), y = Math.round(c.y);
    R(x - 4, y - 1, 8, 2, 'rgba(30,18,8,.3)'); R(x - 3, y + 1, 6, 1, 'rgba(30,18,8,.3)');

function layoutTags() {

}
view.addEventListener('click', e => {
  const p = toWorld(e);
  const c = nearestCell(p.x, p.y); if (c < 0) return;
  let tx = p.x | 0, ty = p.y | 0;
  if (isBlocked(tx, ty)) { tx = (c % GC) * CS + 2; ty = ((c / GC) | 0) * CS + 2; }

window.addEventListener('keydown', e => { if (e.key.startsWith('Arrow') && !/INPUT|TEXTAREA/.test(e.target.tagName)) { keys[e.key] = true; e.preventDefault(); } });
window.addEventListener('keyup', e => { keys[e.key] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

let lastMs = 0;
function render(ms) {
  const t = ms / 1000, dt = Math.min(0.05, Math.max(0, (ms - lastMs) / 1000)); lastMs = ms;
  updatePeople(dt);
  fx.drawImage(bg, 0, 0);
  drawSea(t); drawPier(fx); drawDhow(t);
  drawFountainWater(t);
  drawPeople(t);
  drawHover(t);
  const target = nightTarget();
  nightShown = nightShown == null ? target : nightShown + Math.max(-0.04, Math.min(0.04, target - nightShown));
  drawNight(nightShown, t);
  vx.imageSmoothingEnabled = false;
  vx.drawImage(frame, 0, 0, W, H, 0, 0, view.width, view.height);

buildBackground();
buildPeople();
buildLabels();
fit();
requestAnimationFrame(render);
window.ALIHQ = { chars, byId, goTo, getSprite, setStatus, setNight: v => { nightOverride = v; nightShown = v == null ? null : v ? 1 : 0; } };
